<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon ex Master Binder</title>
<style>
body{margin:0;font-family:Inter,system-ui;background:#0b0f14;color:#f5f7fa}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{padding:18px;background:#10151d;border-right:1px solid #252b36;overflow:auto}.brand{font-size:28px;font-weight:800}.brand span{color:#d8b36a}.collection-btn{width:100%;margin:14px 0 4px;padding:12px;border-radius:12px;border:1px solid #3b4656;background:#18202b;color:#fff;text-align:left;cursor:pointer;font-weight:800}.collection-btn.on{border-color:#73e6a2;background:#13251c;box-shadow:0 0 0 1px rgba(115,230,162,.2) inset}.era-label{margin:16px 0 7px;color:#d8b36a;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.sbtn{width:100%;margin:4px 0;padding:10px;border-radius:10px;border:1px solid transparent;background:#171d27;color:white;text-align:left;cursor:pointer}.sbtn.on{border-color:#d8b36a;background:#211d16}.main{padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;background:#e8edf3;padding:18px;border-radius:18px}.pocket{aspect-ratio:63/88;background:#fff;border-radius:14px;padding:7px}.card{width:100%;height:100%;position:relative;background:#111;border-radius:11px;overflow:hidden;cursor:pointer}.card img{width:100%;height:100%;object-fit:contain;display:block}.card.missing img{filter:grayscale(1) brightness(.45);opacity:.7}.card.owned{box-shadow:0 0 0 3px #73e6a2,0 0 25px #73e6a2}.dot{position:absolute;right:8px;top:8px;width:14px;height:14px;border-radius:50%;background:#777}.owned .dot{background:#73e6a2;box-shadow:0 0 12px #73e6a2}.series-tag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700;max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pager{display:flex;gap:10px;justify-content:center;margin-top:18px}.btn{padding:10px 14px;border:1px solid #303846;border-radius:10px;background:#171d27;color:white}.meta{color:#9ca6b6;font-size:13px}.fallback{display:grid;place-items:center;height:100%;padding:16px;text-align:center;color:#b7c0cf;font-size:12px}.fallback b{display:block;color:#fff;margin-bottom:6px}.empty{grid-column:1/-1;color:#5f6978;text-align:center;padding:70px 20px;font-weight:700}@media(max-width:800px){.app{grid-template-columns:1fr}.side{max-height:32vh}.grid{grid-template-columns:repeat(2,1fr)}}

/* Responsive binder sizing: keep every card inside its pocket and the pager below. */
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
.app,.main,.head,.grid,.pocket,.card{min-width:0}
.grid{align-items:start}
.pocket{width:100%;height:auto;min-height:0;aspect-ratio:63 / 88;overflow:visible}
.card{width:100%;height:100%;aspect-ratio:63 / 88}
.card img{max-width:100%;max-height:100%}
.pager{position:relative;clear:both;flex-wrap:wrap;align-items:center}
@media(max-width:800px){
  .app{display:block;min-height:100vh}
  .side{max-height:none;overflow:visible;padding:14px 14px 12px;border-right:0;border-bottom:1px solid #252b36}
  #series{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .era-label{grid-column:1/-1;margin:9px 0 2px}
  .sbtn{margin:0;padding:9px 8px;font-size:12px;line-height:1.4}
  .sbtn span{float:none!important;display:block;color:#9ca6b6;margin-top:2px}
  .main{padding:14px 10px 24px;width:100%;overflow:hidden}
  .head{gap:12px;align-items:start;flex-wrap:wrap;margin-bottom:14px}
  .head h1{font-size:clamp(22px,6vw,30px);margin:0 0 5px;overflow-wrap:anywhere}
  #global{font-size:12px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px;border-radius:14px;overflow:visible}
  .pocket{padding:5px;border-radius:10px}
  .card{border-radius:8px}
  .card.owned{box-shadow:0 0 0 2px #73e6a2,0 0 12px rgba(115,230,162,.45)}
  .dot{width:11px;height:11px;top:5px;right:5px}
  .series-tag{font-size:9px;left:4px;bottom:4px;padding:3px 5px;max-width:85%}
  .pager{margin-top:18px;padding-bottom:16px}
  .btn{min-height:42px;touch-action:manipulation}
}
@media(max-width:380px){
  .grid{gap:8px;padding:8px}
  .pocket{padding:4px}
  #series{gap:5px}
}
</style></head><body>
<div class="app"><aside class="side"><div class="brand">Pokémon <span>ex</span> Binder</div><p class="meta">Grey = missing · lit = collected</p><button id="collectionBtn" class="collection-btn">★ My Collection <span id="collectionCount" style="float:right"></span></button><div id="series"></div></aside><main class="main"><div class="head"><div><h1 id="title"></h1><div class="meta" id="meta"></div></div><div id="global" class="meta"></div></div><div id="grid" class="grid"></div><div class="pager"><button class="btn" id="prev">‹ Prev</button><span id="page" class="meta"></span><button class="btn" id="next">Next ›</button></div></main></div>
<script src="cards_1.js?v=20261007a"></script>
<script src="cards_2.js?v=20261007a"></script>
<script src="cards_3.js?v=20261007a"></script>
<script src="cards_4.js?v=20261007b"></script>
<script src="cards_5.js?v=20261007a"></script>
<script>
const cards=(window.CARD_CHUNKS||[]).flat();
const scrydexMap={"Scarlet & Violet":"sv1","Paldea Evolved":"sv2","Obsidian Flames":"sv3","151":"sv3pt5","Paradox Rift":"sv4","Paldean Fates":"sv4pt5","Temporal Forces":"sv5","Twilight Masquerade":"sv6","Shrouded Fable":"sv6pt5","Stellar Crown":"sv7","Surging Sparks":"sv8","Prismatic Evolutions":"sv8pt5","Journey Together":"sv9","Destined Rivals":"sv10","White Flare":"rsv10pt5","Black Bolt":"zsv10pt5","Mega Evolution":"me1","Phantasmal Flames":"me2","Ascended Heroes":"me2pt5","Perfect Order":"me3","Chaos Rising":"me4","Pitch Black":"me5","30th Celebration":"me55"};
const ptcgMap={"Scarlet & Violet":"sv1","Paldea Evolved":"sv2","Obsidian Flames":"sv3","151":"sv3pt5","Paradox Rift":"sv4","Paldean Fates":"sv4pt5","Temporal Forces":"sv5","Twilight Masquerade":"sv6","Shrouded Fable":"sv6pt5","Stellar Crown":"sv7","Surging Sparks":"sv8","Prismatic Evolutions":"sv8pt5","Journey Together":"sv9","Destined Rivals":"sv10"};
const order=[...new Set(cards.map(x=>x.series))];
let state={series:order[0],page:0,mode:"series",owned:JSON.parse(localStorage.getItem("owned")||"{}")};
const key=c=>c.series+"|"+c.number+"|"+c.name;
const isOwned=c=>state.owned[key(c)]||c.owned;
function cardNum(c){return c.number.includes("/")?parseInt(c.number.split("/")[0],10):parseInt(c.number.replace(/^[A-Z]+\s*/,""),10)}
function sources(c){
  const n=cardNum(c),out=[];
  if(c.imageId){out.push("https://images.scrydex.com/pokemon/"+c.imageId+"/large");return out;}
  if(c.number.startsWith("SVP")){out.push("https://images.scrydex.com/pokemon/svp-"+n+"/large");out.push("https://images.pokemontcg.io/svp/"+n+"_hires.png");}
  else if(c.number.startsWith("MEP")){out.push("https://images.scrydex.com/pokemon/mep-"+n+"/large");}
  else{
    const s=scrydexMap[c.series];if(s)out.push("https://images.scrydex.com/pokemon/"+s+"-"+n+"/large");
    const p=ptcgMap[c.series];if(p)out.push("https://images.pokemontcg.io/"+p+"/"+n+"_hires.png");
  }
  return out;
}
function imgHTML(c){
  const srcs=sources(c);if(!srcs.length)return '<div class="fallback"><div><b>'+c.name+'</b>'+c.number+'</div></div>';
  const payload=encodeURIComponent(JSON.stringify(srcs.slice(1)));
  return '<img src="'+srcs[0]+'" data-fallbacks="'+payload+'" alt="'+c.name.replace(/"/g,"&quot;")+'">';
}
function bindFallbacks(){
  document.querySelectorAll(".card img").forEach(img=>{
    img.onerror=()=>{
      let arr=[];try{arr=JSON.parse(decodeURIComponent(img.dataset.fallbacks||"%5B%5D"))}catch(e){}
      if(arr.length){img.dataset.fallbacks=encodeURIComponent(JSON.stringify(arr.slice(1)));img.src=arr[0];}
      else{const c=img.closest(".card");const tag=c.querySelector(".series-tag");c.innerHTML='<div class="fallback"><div><b>Image unavailable</b>Card data is still in the binder.</div></div><div class="dot"></div>'+(tag?tag.outerHTML:"");}
    };
  });
}
function currentCards(){
  if(state.mode==="collection") return cards.filter(isOwned);
  return cards.filter(c=>c.series===state.series);
}
function render(){
  const allOwned=cards.filter(isOwned).length;
  document.getElementById("collectionCount").textContent=allOwned;
  document.getElementById("collectionBtn").className="collection-btn"+(state.mode==="collection"?" on":"");

  let side="",lastEra="";
  for(const s of order){
    const era=cards.find(c=>c.series===s)?.era||"";
    if(era!==lastEra){side+='<div class="era-label">'+era+'</div>';lastEra=era;}
    let cs=cards.filter(c=>c.series===s),o=cs.filter(isOwned).length;
    side+='<button class="sbtn '+(state.mode==="series"&&s===state.series?"on":"")+'" data-series="'+s.replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'">'+s+'<span style="float:right">'+o+'/'+cs.length+'</span></button>';
  }
  document.getElementById("series").innerHTML=side;
  document.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>{state.mode="series";state.series=b.dataset.series;state.page=0;render();});
  document.getElementById("collectionBtn").onclick=()=>{state.mode="collection";state.page=0;render();};

  let cs=currentCards(),pages=Math.max(1,Math.ceil(cs.length/9));state.page=Math.min(state.page,pages-1);let pc=cs.slice(state.page*9,state.page*9+9);
  if(state.mode==="collection"){
    document.getElementById("title").textContent="My Collection";
    document.getElementById("meta").textContent=cs.length+" collected cards";
  }else{
    document.getElementById("title").textContent=state.series;
    document.getElementById("meta").textContent=cs.filter(isOwned).length+" / "+cs.length+" collected";
  }
  document.getElementById("page").textContent=(state.page+1)+" / "+pages;
  document.getElementById("global").textContent=allOwned+" / "+cards.length+" total · "+order.length+" series";

  let html="";
  if(pc.length===0){
    html='<div class="empty">You have not collected any cards yet.</div>';
  }else{
    for(const c of pc){
      let o=isOwned(c);
      html+='<div class="pocket"><div class="card '+(o?"owned":"missing")+'" data-key="'+encodeURIComponent(key(c))+'">'+imgHTML(c)+'<div class="dot"></div>'+(state.mode==="collection"?'<div class="series-tag">'+c.series+'</div>':"")+'</div></div>';
    }
  }
  document.getElementById("grid").innerHTML=html;
  bindFallbacks();
  document.querySelectorAll(".card").forEach(el=>el.onclick=()=>{
    let k=decodeURIComponent(el.dataset.key);
    state.owned[k]=!state.owned[k];
    localStorage.setItem("owned",JSON.stringify(state.owned));
    render();
  });
}
document.getElementById("prev").onclick=()=>{let cs=currentCards(),p=Math.max(1,Math.ceil(cs.length/9));state.page=(state.page-1+p)%p;render();};
document.getElementById("next").onclick=()=>{let cs=currentCards(),p=Math.max(1,Math.ceil(cs.length/9));state.page=(state.page+1)%p;render();};
render();
</script></body></html>
