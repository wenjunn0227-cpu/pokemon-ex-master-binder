<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon ex Master Binder</title>
<style>
body{margin:0;font-family:Inter,system-ui;background:#0b0f14;color:#f5f7fa}.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{padding:18px;background:#10151d;border-right:1px solid #252b36;overflow:auto}.brand{font-size:28px;font-weight:800}.brand span{color:#d8b36a}.collection-btn{width:100%;margin:14px 0 4px;padding:12px;border-radius:12px;border:1px solid #3b4656;background:#18202b;color:#fff;text-align:left;cursor:pointer;font-weight:800}.collection-btn.on{border-color:#73e6a2;background:#13251c;box-shadow:0 0 0 1px rgba(115,230,162,.2) inset}.era-label{margin:16px 0 7px;color:#d8b36a;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.sbtn{width:100%;margin:4px 0;padding:10px;border-radius:10px;border:1px solid transparent;background:#171d27;color:white;text-align:left;cursor:pointer}.sbtn.on{border-color:#d8b36a;background:#211d16}.main{padding:22px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;background:#e8edf3;padding:18px;border-radius:18px}.pocket{aspect-ratio:63/88;background:#fff;border-radius:14px;padding:7px}.card{width:100%;height:100%;position:relative;background:#111;border-radius:11px;overflow:hidden;cursor:pointer}.card img{width:100%;height:100%;object-fit:contain;display:block}.card.missing img{filter:grayscale(1) brightness(.45);opacity:.7}.card.owned{box-shadow:0 0 0 3px #73e6a2,0 0 25px #73e6a2}.dot{position:absolute;right:8px;top:8px;width:14px;height:14px;border-radius:50%;background:#777}.owned .dot{background:#73e6a2;box-shadow:0 0 12px #73e6a2}.slot-tag{position:absolute;right:7px;bottom:7px;background:rgba(255,255,255,.9);color:#111;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800;z-index:2}.series-tag{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:700;max-width:78%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pager{display:flex;gap:10px;justify-content:center;margin-top:18px}.btn{padding:10px 14px;border:1px solid #303846;border-radius:10px;background:#171d27;color:white}.meta{color:#9ca6b6;font-size:13px}.fallback{display:grid;place-items:center;height:100%;padding:16px;text-align:center;color:#b7c0cf;font-size:12px}.fallback b{display:block;color:#fff;margin-bottom:6px}.empty{grid-column:1/-1;color:#5f6978;text-align:center;padding:70px 20px;font-weight:700}@media(max-width:800px){.app{grid-template-columns:1fr}.side{max-height:32vh}.grid{grid-template-columns:repeat(2,1fr)}}

/* Responsive binder sizing: keep every card inside its pocket and the pager below. */
*,*::before,*::after{box-sizing:border-box}
html,body{width:100%;max-width:100%;overflow-x:hidden}
.app,.main,.head,.grid,.pocket,.card{min-width:0}
.grid{align-items:start}
.pocket{width:100%;height:auto;min-height:0;aspect-ratio:63 / 88;overflow:visible}
.card{width:100%;height:100%;aspect-ratio:63 / 88}
.card img{max-width:100%;max-height:100%}
.pager{position:relative;clear:both;flex-wrap:wrap;align-items:center}
@media(max-width:800px){
  .app{display:block;min-height:100vh}
  .side{max-height:none;overflow:visible;padding:14px 14px 12px;border-right:0;border-bottom:1px solid #252b36}
  #series{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .era-label{grid-column:1/-1;margin:9px 0 2px}
  .sbtn{margin:0;padding:9px 8px;font-size:12px;line-height:1.4}
  .sbtn span{float:none!important;display:block;color:#9ca6b6;margin-top:2px}
  .main{padding:14px 10px 24px;width:100%;overflow:hidden}
  .head{gap:12px;align-items:start;flex-wrap:wrap;margin-bottom:14px}
  .head h1{font-size:clamp(22px,6vw,30px);margin:0 0 5px;overflow-wrap:anywhere}
  #global{font-size:12px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px;border-radius:14px;overflow:visible}
  .pocket{padding:5px;border-radius:10px}
  .card{border-radius:8px}
  .card.owned{box-shadow:0 0 0 2px #73e6a2,0 0 12px rgba(115,230,162,.45)}
  .dot{width:11px;height:11px;top:5px;right:5px}
  .slot-tag{font-size:9px;right:4px;bottom:4px;padding:3px 5px}.series-tag{font-size:9px;left:4px;bottom:4px;padding:3px 5px;max-width:70%}
  .pager{margin-top:18px;padding-bottom:16px}
  .btn{min-height:42px;touch-action:manipulation}
}
@media(max-width:380px){
  .grid{gap:8px;padding:8px}
  .pocket{padding:4px}
  #series{gap:5px}
}
.pocket{aspect-ratio:auto}.card{height:auto;display:block;border:0;padding:0;color:inherit;font:inherit}.card-caption{color:#18202b;padding:8px 2px 3px;line-height:1.4}.card-caption strong,.card-caption span,.card-caption small{display:block}.card-caption strong{font-size:14px}.card-caption span{font-size:12px;margin-top:3px}.card-caption small{font-size:10px;color:#596579;margin-top:2px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input{background:#171d27;border:1px solid #3b4656;color:#fff;border-radius:10px;padding:11px;min-width:0}.toolbar #search{flex:1;min-width:200px}.toolbar form{display:flex;gap:6px}.toolbar #jumpPage{width:76px}.reserved-inner{aspect-ratio:63/88;border:1px dashed #b2bccb;border-radius:10px;display:grid;place-content:center;text-align:center;color:#6b7686;font-size:12px;line-height:1.7}.audit-info{margin:14px 0;color:#9ca6b6;font-size:12px;line-height:1.7}.audit-info summary{cursor:pointer;color:#d8b36a}.audit-info a{color:#d8b36a}.position-guide{display:grid;grid-template-columns:repeat(3,22px);gap:3px;margin:6px 0}.position-guide span{background:#26303e;text-align:center;border-radius:3px}.grid.physical{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:800px){.grid.physical{gap:8px;padding:8px}.physical .card-caption strong{font-size:11px}.physical .card-caption span{font-size:10px}.physical .card-caption small{font-size:9px}.toolbar #search{min-width:100%;}.card-caption strong{font-size:12px}.reserved-inner{font-size:10px}}
</style></head><body>
<div class="app"><aside class="side"><div class="brand">Pokémon <span>ex</span> Binder</div><p class="meta">Grey = missing · lit = collected</p><button id="collectionBtn" class="collection-btn">★ My Collection <span id="collectionCount" style="float:right"></span></button><div id="series"></div></aside><main class="main"><div class="head"><div><h1 id="title"></h1><div class="meta" id="meta"></div></div><div id="global" class="meta"></div></div><div id="grid" class="grid"></div><div class="pager"><button class="btn" id="prev">‹ Prev</button><span id="page" class="meta"></span><button class="btn" id="next">Next ›</button></div></main></div>
<script>
document.querySelector('.side .meta').insertAdjacentHTML('afterend','<button id="binderBtn" class="collection-btn">▦ 實體 Binder · 3×3</button><details class="audit-info"><summary>格位說明與核對範圍</summary><p>格位從左至右、由上至下：</p><div class="position-guide"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span></div><p>每一面算一頁，正面第 1 頁、背面第 2 頁。主系列依原格位排列；移除大寫 EX 後的三格保留為空格；Promo 獨立成 SVP Promos 與 MEP Promos，放在主系列後方。搜尋與已收藏清單的畫面頁碼不影響實體位置。</p><p id="auditSummary">核對版 v2 · 402 張 / 45 頁 · 2026-10-08 核對，發售範圍截至 2026-10-07。收錄普通 ex、普通版 Black Star Promo ex（獨立分類）、2023 Classic 三張小寫 ex；不收錄大寫 EX／Classic Collection 復刻 EX。排除 Full Art、SIR、Gold、Shiny Full Art、Mega Attack Rare、Jumbo。相同卡號的印章與閃膜變體共用一格。</p><p>現有位置固定；未來新卡追加至空格，不自動插入前面的系列。</p><a href="audit.html" target="_blank" rel="noopener">查看核對紀錄與來源</a></details>');
document.getElementById('grid').insertAdjacentHTML('beforebegin','<div class="toolbar"><input id="search" type="search" placeholder="搜尋卡名、卡號或系列…" aria-label="搜尋卡片"><form id="jumpForm"><label for="jumpPage" class="meta" style="align-self:center">跳至實體頁</label><input id="jumpPage" type="number" min="1" max="60" value="1" aria-label="實體頁碼"><button class="btn" type="submit">Go</button></form></div>');
</script>

<script>
const cards=(window.CARD_CHUNKS||[]).flat();
const scrydexMap={"Scarlet & Violet":"sv1","Paldea Evolved":"sv2","Obsidian Flames":"sv3","151":"sv3pt5","Paradox Rift":"sv4","Paldean Fates":"sv4pt5","Temporal Forces":"sv5","Twilight Masquerade":"sv6","Shrouded Fable":"sv6pt5","Stellar Crown":"sv7","Surging Sparks":"sv8","Prismatic Evolutions":"sv8pt5","Journey Together":"sv9","Destined Rivals":"sv10","White Flare":"rsv10pt5","Black Bolt":"zsv10pt5","Mega Evolution":"me1","Phantasmal Flames":"me2","Ascended Heroes":"me2pt5","Perfect Order":"me3","Chaos Rising":"me4","Pitch Black":"me5","30th Celebration":"me55"};
const ptcgMap={"Scarlet & Violet":"sv1","Paldea Evolved":"sv2","Obsidian Flames":"sv3","151":"sv3pt5","Paradox Rift":"sv4","Paldean Fates":"sv4pt5","Temporal Forces":"sv5","Twilight Masquerade":"sv6","Shrouded Fable":"sv6pt5","Stellar Crown":"sv7","Surging Sparks":"sv8","Prismatic Evolutions":"sv8pt5","Journey Together":"sv9","Destined Rivals":"sv10"};
const order=["Scarlet & Violet","Paldea Evolved","Obsidian Flames","151","Paradox Rift","Pokémon TCG Classic","Paldean Fates","Temporal Forces","Twilight Masquerade","Shrouded Fable","Stellar Crown","Surging Sparks","Prismatic Evolutions","Journey Together","Destined Rivals","White Flare","Black Bolt","Mega Evolution","Phantasmal Flames","Ascended Heroes","Perfect Order","Chaos Rising","Pitch Black","30th Celebration","SVP Promos","MEP Promos"];
const seriesRank=new Map(order.map((s,i)=>[s,i]));
function numValue(c){
  if(c.number.startsWith("SVP")) return 100000+parseInt(c.number.replace(/\D/g,""),10);
  if(c.number.startsWith("MEP")) return 200000+parseInt(c.number.replace(/\D/g,""),10);
  const n=parseInt(c.number.split("/")[0],10)||0;
  return c.type==="Classic Collection EX"?300000+n:n;
}
cards.sort((a,b)=>(seriesRank.get(a.series)-seriesRank.get(b.series)) || (numValue(a)-numValue(b)) || a.name.localeCompare(b.name));
const slotMap=new Map(cards.map(c=>[keySeed(c),c.binderSlot]));
const capacity=540;
function position(c){const slot=slotMap.get(keySeed(c));return {slot,page:Math.floor((slot-1)/9)+1,pocket:(slot-1)%9+1};}
function positionLabel(c){const p=position(c);return '第 '+p.page+' 頁 · 第 '+p.pocket+' 格';}
function keySeed(c){return c.series+"|"+c.number+"|"+c.name;}
let savedOwned={};try{savedOwned=JSON.parse(localStorage.getItem('owned')||'{}');if(!savedOwned||typeof savedOwned!=='object'||Array.isArray(savedOwned))savedOwned={};}catch(e){}
for(const c of cards){for(const alias of c.previousKeys||[]){if(!Object.prototype.hasOwnProperty.call(savedOwned,keySeed(c))&&Object.prototype.hasOwnProperty.call(savedOwned,alias))savedOwned[keySeed(c)]=savedOwned[alias];}}
// The owner confirmed all 12 ordinary 30th ex targets collected on 2026-10-08.
// Apply once so subsequent manual unchecks remain respected.
const collectionConfirmation='30th-lowercase-complete-20261008';
if(localStorage.getItem(collectionConfirmation)!=='1'){
  for(const c of cards.filter(c=>c.series==='30th Celebration'))savedOwned[keySeed(c)]=true;
  localStorage.setItem('owned',JSON.stringify(savedOwned));
  localStorage.setItem(collectionConfirmation,'1');
}
let state={series:order[0],page:0,mode:"binder",query:"",owned:savedOwned};
const key=c=>keySeed(c);
const isOwned=c=>Object.prototype.hasOwnProperty.call(state.owned,key(c))?state.owned[key(c)]:!!c.owned;
function cardNum(c){return c.number.includes("/")?parseInt(c.number.split("/")[0],10):parseInt(c.number.replace(/^[A-Z]+\s*/,""),10)}
function sources(c){
  const n=cardNum(c),out=[];
  if(c.imageUrl){out.push(c.imageUrl,...(c.fallbackImageUrls||[]));return out;}
  if(c.imageId){out.push("https://images.scrydex.com/pokemon/"+c.imageId+"/large");return out;}
  if(c.number.startsWith("SVP")){out.push("https://images.scrydex.com/pokemon/svp-"+n+"/large");out.push("https://images.pokemontcg.io/svp/"+n+"_hires.png");}
  else if(c.number.startsWith("MEP")){out.push("https://images.scrydex.com/pokemon/mep-"+n+"/large");}
  else{
    const s=scrydexMap[c.series];if(s)out.push("https://images.scrydex.com/pokemon/"+s+"-"+n+"/large");
    const p=ptcgMap[c.series];if(p)out.push("https://images.pokemontcg.io/"+p+"/"+n+"_hires.png");
  }
  return out;
}
function imgHTML(c){
  const srcs=sources(c);if(!srcs.length)return '<div class="fallback"><div><b>'+c.name+'</b>'+c.number+'</div></div>';
  const payload=encodeURIComponent(JSON.stringify(srcs.slice(1)));
  return '<img src="'+srcs[0]+'" data-fallbacks="'+payload+'" alt="'+c.name.replace(/"/g,"&quot;")+'">';
}
function bindFallbacks(){
  document.querySelectorAll(".card img").forEach(img=>{
    img.onerror=()=>{
      let arr=[];try{arr=JSON.parse(decodeURIComponent(img.dataset.fallbacks||"%5B%5D"))}catch(e){}
      if(arr.length){img.dataset.fallbacks=encodeURIComponent(JSON.stringify(arr.slice(1)));img.src=arr[0];}
      else{const c=img.closest(".card");const tags=Array.from(c.querySelectorAll('.series-tag,.slot-tag')).map(t=>t.outerHTML).join('');c.innerHTML='<div class="fallback"><div><b>Image unavailable</b>Card data is still in the binder.</div></div><div class="dot"></div>'+tags;}
    };
  });
}
function currentCards(){
  if(state.query){const q=state.query.toLowerCase();return cards.filter(c=>[c.name,c.number,c.series].join(' ').toLowerCase().includes(q));}
  if(state.mode==="binder")return cards.slice().sort((a,b)=>a.binderSlot-b.binderSlot);
  if(state.mode==="collection") return cards.filter(isOwned);
  return cards.filter(c=>c.series===state.series);
}
function render(){
  const allOwned=cards.filter(isOwned).length;
  document.getElementById("collectionCount").textContent=allOwned;
  document.getElementById("collectionBtn").className="collection-btn"+(state.mode==="collection"?" on":"");
  document.getElementById('binderBtn').className='collection-btn'+(state.mode==='binder'&&!state.query?' on':'');
  document.getElementById('grid').classList.toggle('physical',state.mode==='binder'&&!state.query);

  let side="",lastEra="";
  for(const s of order){
    const era=cards.find(c=>c.series===s)?.era||"";
    if(era!==lastEra){side+='<div class="era-label">'+era+'</div>';lastEra=era;}
    let cs=cards.filter(c=>c.series===s),o=cs.filter(isOwned).length;
    side+='<button class="sbtn '+(state.mode==="series"&&s===state.series?"on":"")+'" data-series="'+s.replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'">'+s+'<span style="float:right">'+o+'/'+cs.length+'</span></button>';
  }
  document.getElementById("series").innerHTML=side;
  document.querySelectorAll(".sbtn").forEach(b=>b.onclick=()=>{clearSearch();state.mode="series";state.series=b.dataset.series;state.page=0;render();});
  document.getElementById("collectionBtn").onclick=()=>{clearSearch();state.mode="collection";state.page=0;render();};
  document.getElementById('binderBtn').onclick=()=>{clearSearch();state.mode='binder';state.page=0;render();};

  let cs=currentCards(),physical=state.mode==='binder'&&!state.query,pages=physical?Math.ceil(capacity/9):Math.max(1,Math.ceil(cs.length/9));state.page=Math.min(state.page,pages-1);let pc=physical?Array.from({length:9},(_,i)=>cs.find(c=>c.binderSlot===state.page*9+i+1)||null):cs.slice(state.page*9,state.page*9+9);
  if(state.query){
    document.getElementById('title').textContent='搜尋結果';
    document.getElementById('meta').textContent=cs.length+' 張符合 · 下方標示為固定實體格位';
  }else if(physical){
    document.getElementById('title').textContent='實體 Binder · 第 '+(state.page+1)+' 頁';
    document.getElementById('meta').textContent='每一面算 1 頁 · 左上到右下 1–9 格 · 共 60 頁 / 540 格';
  }else if(state.mode==="collection"){
    document.getElementById("title").textContent="My Collection";
    document.getElementById("meta").textContent=cs.length+" collected cards";
  }else{
    document.getElementById("title").textContent=state.series;
    document.getElementById("meta").textContent=cs.filter(isOwned).length+" / "+cs.length+" collected";
  }
  document.getElementById("page").textContent=(physical?'實體頁 ':'畫面頁 ')+(state.page+1)+" / "+pages;
  document.getElementById("global").textContent=allOwned+" / "+cards.length+" collected · "+(capacity-cards.length)+" 空格";

  let html="";
  if(pc.length===0){
    html='<div class="empty">You have not collected any cards yet.</div>';
  }else{
    for(const c of pc){
      if(!c){const pocket=html.match(/class="pocket/g)?.length||0;html+='<div class="pocket reserved"><div class="reserved-inner">預留空格<br>第 '+(state.page+1)+' 頁 · 第 '+(pocket+1)+' 格</div></div>';continue;}
      let o=isOwned(c);
      html+='<div class="pocket"><button type="button" aria-label="'+escapeHTML(c.name+' '+c.number+' '+positionLabel(c)+(o?'，已收藏':'，未收藏'))+'" aria-pressed="'+o+'" class="card '+(o?"owned":"missing")+'" data-key="'+encodeURIComponent(key(c))+'">'+imgHTML(c)+'<div class="dot"></div><div class="slot-tag">#'+String(slotMap.get(key(c))).padStart(3,"0")+'</div></button><div class="card-caption"><strong>'+positionLabel(c)+'</strong><span>'+escapeHTML(c.name)+' · '+escapeHTML(c.number)+'</span><small>'+escapeHTML(c.series)+'</small></div></div>';
    }
  }
  document.getElementById("grid").innerHTML=html;
  bindFallbacks();
  document.querySelectorAll(".card").forEach(el=>el.onclick=()=>{
    let k=decodeURIComponent(el.dataset.key);
    const c=cards.find(c=>key(c)===k);state.owned[k]=!isOwned(c);
    localStorage.setItem("owned",JSON.stringify(state.owned));
    render();
  });
}
document.getElementById("prev").onclick=()=>{let cs=currentCards(),p=Math.max(1,Math.ceil(cs.length/9));state.page=(state.page-1+p)%p;render();};
document.getElementById("next").onclick=()=>{let cs=currentCards(),p=Math.max(1,Math.ceil(cs.length/9));state.page=(state.page+1)%p;render();};
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clearSearch(){state.query='';document.getElementById('search').value='';}
function viewPages(){return state.mode==='binder'&&!state.query?Math.ceil(capacity/9):Math.max(1,Math.ceil(currentCards().length/9));}
document.getElementById('prev').onclick=()=>{const p=viewPages();state.page=(state.page-1+p)%p;render();};
document.getElementById('next').onclick=()=>{const p=viewPages();state.page=(state.page+1)%p;render();};
document.getElementById('search').oninput=e=>{state.query=e.target.value.trim();state.page=0;render();};
document.getElementById('jumpForm').onsubmit=e=>{e.preventDefault();const p=Number(document.getElementById('jumpPage').value);if(!Number.isInteger(p)||p<1||p>60)return;clearSearch();state.mode='binder';state.page=p-1;render();};
render();
</script></body></html>
